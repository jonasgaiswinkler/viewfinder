# see https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#use-docker-socket-binding
image: docker:latest

# One of the new trends in Continuous Integration/Deployment is to:
# (see https://docs.gitlab.com/ee/ci/docker/using_docker_build.html)
#
# 1. Create an application image
# 2. Run tests against the created image
# 3. Push image to a remote registry
# 4. Deploy to a server from the pushed image

.rule_backend:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backend/**/*

.rule_frontend:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - frontend/**/*

stages:
  - build
  - push

# see usage of Namespaces at https://docs.gitlab.com/ee/user/group/#namespaces
variables:
  REGISTRY_GROUP_PROJECT: $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME

# see how to login at https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#using-the-gitlab-container-registry
before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY

build-backend:
  stage: build
  tags:
    - docker
  rules:
    - !reference [.rule_backend, rules]
  script:
    - docker build --pull -t $REGISTRY_GROUP_PROJECT/backend ./backend

build-frontend:
  stage: build
  tags:
    - docker
  rules:
    - !reference [.rule_frontend, rules]
  script:
    - docker build --pull -t $REGISTRY_GROUP_PROJECT/frontend ./frontend

push-backend:
  stage: push
  tags:
    - docker
  rules:
    - !reference [.rule_backend, rules]
  script:
    - docker push $REGISTRY_GROUP_PROJECT/backend

push-frontend:
  stage: push
  tags:
    - docker
  rules:
    - !reference [.rule_frontend, rules]
  script:
    - docker push $REGISTRY_GROUP_PROJECT/frontend
